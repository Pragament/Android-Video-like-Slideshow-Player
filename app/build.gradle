plugins {
    id 'com.android.application'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.media3:media3-exoplayer:1.4.1'
        force 'androidx.media3:media3-ui:1.4.1'
        force 'androidx.media3:media3-common:1.4.1'
        force 'androidx.media3:media3-session:1.4.1'
        force 'androidx.media3:media3-datasource:1.4.1'
        force 'androidx.media3:media3-decoder:1.4.1'
        force 'androidx.media3:media3-database:1.4.1'
        force 'androidx.media3:media3-extractor:1.4.1'
        force 'androidx.media3:media3-container:1.4.1'
    }
}

android {
    namespace "com.technikh.evideos"
    compileSdk 35

    defaultConfig {
        applicationId "com.technikh.evideos"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    packagingOptions {
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // ✅ Local Modules (Offline Libraries)
    implementation project(':AndroidViewAnimations')   // YoYo + Techniques
    implementation project(':AndroidVideoCache')       // HttpProxyCacheServer
    implementation project(':AnimationEasingFunctions')
    implementation project(':ChipsLayoutManager')
    implementation project(':ZoomLayout')

    // ✅ ZoomLayout (Online)
    implementation "com.otaliastudios:zoomlayout:1.9.0"

    // ✅ BubbleSeekBar (JitPack)
    implementation "com.github.woxingxiao:BubbleSeekBar:3.20"

    // --- ANDROIDX & CORE ---
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // --- NETWORKING ---
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.2"
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "com.android.volley:volley:1.2.1"
    implementation "com.loopj.android:android-async-http:1.4.11"

    // --- FIREBASE ---
    implementation platform("com.google.firebase:firebase-bom:34.8.0")
    implementation "com.google.firebase:firebase-analytics"

    // ✅ IMPORTANT FIX: exclude vision-common (prevents duplicate classes)
    implementation("com.google.firebase:firebase-ml-vision:24.1.0") {
        exclude group: "com.google.android.gms", module: "play-services-vision-common"
    }

    // --- UI UTILS & MEDIA ---
    implementation "com.github.bumptech.glide:glide:5.0.5"
    annotationProcessor "com.github.bumptech.glide:compiler:5.0.5"

    implementation "com.github.2coffees1team:GlideToVectorYou:v2.0.0"
    implementation "com.sothree.slidinguppanel:library:3.4.0"
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    implementation "com.flaviofaria:kenburnsview:1.0.7"
    implementation "com.pnikosis:materialish-progress:1.7"
    implementation "com.github.yalantis:ucrop:2.2.8"
    implementation "com.github.mthli:Knife:v1.1"
    implementation "com.bogdwellers:pinchtozoom:0.1"
    implementation "com.github.bmelnychuk:atv:1.2.9"
    implementation "com.annimon:stream:1.2.2"
    implementation "com.github.johnkil.print:print:1.3.1"
    implementation "org.slf4j:slf4j-api:2.0.17"

    // --- FLEXBOX ---
    implementation "com.google.android.flexbox:flexbox:3.0.0"

    // --- GOOGLE VISION (ONLY ONE) ---
    implementation "com.google.android.gms:play-services-vision:20.0.0"
    implementation "com.google.android.gms:play-services-base:18.5.0"

    // --- MEDIA3 ---
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    implementation "androidx.media3:media3-datasource:1.4.1"
    implementation "androidx.media3:media3-decoder:1.4.1"
    implementation "androidx.media3:media3-database:1.4.1"
    implementation "androidx.media3:media3-extractor:1.4.1"
    implementation "androidx.media3:media3-container:1.4.1"


    implementation("com.otaliastudios.opengl:egloo:0.6.1")

    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.media3:media3-common:1.4.1")

    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
}
